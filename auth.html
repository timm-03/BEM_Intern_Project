  <!-- Core Stylesheet -->

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
    }

    /* Ambient glows */
    .glow-blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }
    .glow-blob-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #f2dcca 0%, transparent 70%);
      top: -100px; left: -80px;
    }
    .glow-blob-2 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #eae1d7 0%, transparent 70%);
      bottom: 60px; right: -60px;
    }
    [data-theme="dark"] .glow-blob-1 {
      background: radial-gradient(circle, rgba(73,71,64,0.7) 0%, transparent 70%);
    }
    [data-theme="dark"] .glow-blob-2 {
      background: radial-gradient(circle, rgba(64,45,12,0.5) 0%, transparent 70%);
    }

    /* Tab switcher */
    .tab-switcher {
      display: flex;
      background: var(--color-surface-container, #f1ede8);
      border-radius: 9999px;
      padding: 4px;
      gap: 2px;
      margin-bottom: 1.75rem;
    }
    [data-theme="dark"] .tab-switcher, html.dark .tab-switcher {
      background: #1f2029;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 9999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--color-on-surface-variant, #444748);
      transition: background 0.2s, color 0.2s;
    }
    [data-theme="dark"] .tab-btn, html.dark .tab-btn {
      color: #9e9a92;
    }
    .tab-btn.active {
      background: var(--color-primary, #040505);
      color: var(--color-on-primary, #ffffff);
    }
    [data-theme="dark"] .tab-btn.active, html.dark .tab-btn.active {
      background: #f4efe6;
      color: #0e0f12;
    }

    /* Form fields */
    .form-group { margin-bottom: 1.1rem; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-on-surface-variant, #444748);
      margin-bottom: 6px;
    }
    [data-theme="dark"] .form-label, html.dark .form-label {
      color: #9e9a92;
    }
    .form-input-wrap { position: relative; }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--color-surface-container-low, #f7f3ee);
      border: 1.5px solid var(--color-outline-variant, #c4c7c7);
      border-radius: 0.75rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      color: var(--color-on-surface, #1c1c19);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    [data-theme="dark"] .form-input, html.dark .form-input {
      background: #1f2029;
      border-color: #2a2c36;
      color: #f4efe6;
    }
    [data-theme="dark"] .form-input::placeholder { color: #9e9a92; }
    .form-input:focus {
      border-color: var(--color-secondary, #6c5b4d);
      box-shadow: 0 0 0 3px rgba(108,91,77,0.12);
    }
    .form-input.has-toggle { padding-right: 44px; }
    .form-input.error {
      border-color: var(--color-error, #ba1a1a);
      box-shadow: 0 0 0 3px rgba(186,26,26,0.1);
    }
    .form-error {
      display: none;
      font-size: 11px;
      color: var(--color-error, #ba1a1a);
      margin-top: 4px;
      font-weight: 500;
    }
    .form-error.visible { display: block; }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-on-surface-variant, #444748);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      border-radius: 6px;
    }
    [data-theme="dark"] .pw-toggle, html.dark .pw-toggle {
      color: #9e9a92;
    }
    .pw-toggle .material-symbols-outlined { font-size: 18px; }

    /* Submit button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--color-primary, #040505);
      color: var(--color-on-primary, #ffffff);
      border: none;
      border-radius: 9999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    [data-theme="dark"] .btn-submit, html.dark .btn-submit {
      background: #f4efe6;
      color: #0e0f12;
    }

    /* Privacy pill */
    .privacy-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-secondary-container, #f2dcca);
      border-radius: 9999px;
      padding: 5px 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-secondary, #6c5b4d);
    }
    [data-theme="dark"] .privacy-pill, html.dark .privacy-pill {
      background: #1f2029;
      color: #c8a97e;
    }
    .privacy-pill .material-symbols-outlined { font-size: 13px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--color-inverse-surface, #31302d);
      color: var(--color-inverse-on-surface, #f4f0eb);
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      white-space: nowrap;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    [data-theme="dark"] #toast, html.dark #toast {
      background: #f4efe6;
      color: #0e0f12;
    }

    /* Tab panel */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    [data-theme="dark"] .spinner, html.dark .spinner {
      border-color: rgba(14,15,18,0.3);
      border-top-color: #0e0f12;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="js/auth.js" defer></script>
  <script src="js/ui.js" defer></script>
</head>

  <!-- Skrip Autentikasi -->
  <script>
  (function () {

    // ── Helpers ──────────────────────────────────────────────────────
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function $(id) { return document.getElementById(id); }

    function setError(id, msg) {
      var el = $(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('visible', !!msg);
    }

    function clearErrors(ids) {
      ids.forEach(function(id) { setError(id, ''); });
    }

    function markField(inputId, hasErr) {
      var el = $(inputId);
      if (el) el.classList.toggle('error', hasErr);
    }

    // ── Toast ─────────────────────────────────────────────────────────
    var toastTimer = null;
    function showToast(msg, type) {
      var toast = $('toast');
      var msgEl = $('toast-msg');
      var iconEl = $('toast-icon');
      if (!toast || !msgEl) return;
      msgEl.textContent = msg;
      if (iconEl) iconEl.textContent = type === 'error' ? 'error' : 'check_circle';
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
    }

    // ── Tab switcher ──────────────────────────────────────────────────
    window.switchTab = function (tab) {
      var panels = { login: $('panel-login'), register: $('panel-register') };
      var btns   = { login: $('tab-login-btn'), register: $('tab-register-btn') };
      Object.keys(panels).forEach(function (k) {
        panels[k].classList.toggle('active', k === tab);
        btns[k].classList.toggle('active', k === tab);
        btns[k].setAttribute('aria-selected', k === tab ? 'true' : 'false');
      });
      clearErrors(['login-email-err','login-password-err','login-general-err',
                   'reg-name-err','reg-email-err','reg-password-err','reg-general-err']);
    };

    // ── Password toggle ───────────────────────────────────────────────
    window.togglePw = function (inputId, iconId) {
      var inp = $(inputId);
      var ico = $(iconId);
      if (!inp) return;
      var showing = inp.type === 'text';
      inp.type = showing ? 'password' : 'text';
      if (ico) ico.textContent = showing ? 'visibility_off' : 'visibility';
    };

    // ── Validation helpers ────────────────────────────────────────────
    function validateLoginForm() {
      var email    = $('login-email').value.trim();
      var password = $('login-password').value;
      var ok = true;

      clearErrors(['login-email-err','login-password-err','login-general-err']);
      markField('login-email', false);
      markField('login-password', false);

      if (!email) {
        setError('login-email-err', 'Email tidak boleh kosong.');
        markField('login-email', true); ok = false;
      } else if (!EMAIL_RE.test(email)) {
        setError('login-email-err', 'Format email tidak valid.');
        markField('login-email', true); ok = false;
      }

      if (!password) {
        setError('login-password-err', 'Password tidak boleh kosong.');
        markField('login-password', true); ok = false;
      } else if (password.length < 6) {
        setError('login-password-err', 'Password minimal 6 karakter.');
        markField('login-password', true); ok = false;
      }

      return ok;
    }

    function validateRegisterForm() {
      var name     = $('reg-name').value.trim();
      var email    = $('reg-email').value.trim();
      var password = $('reg-password').value;
      var ok = true;

      clearErrors(['reg-name-err','reg-email-err','reg-password-err','reg-general-err']);
      markField('reg-name', false);
      markField('reg-email', false);
      markField('reg-password', false);

      if (!name) {
        setError('reg-name-err', 'Nama lengkap tidak boleh kosong.');
        markField('reg-name', true); ok = false;
      } else if (name.length < 2) {
        setError('reg-name-err', 'Nama terlalu pendek.');
        markField('reg-name', true); ok = false;
      }

      if (!email) {
        setError('reg-email-err', 'Email tidak boleh kosong.');
        markField('reg-email', true); ok = false;
      } else if (!EMAIL_RE.test(email)) {
        setError('reg-email-err', 'Format email tidak valid.');
        markField('reg-email', true); ok = false;
      }

      if (!password) {
        setError('reg-password-err', 'Password tidak boleh kosong.');
        markField('reg-password', true); ok = false;
      } else if (password.length < 6) {
        setError('reg-password-err', 'Password minimal 6 karakter.');
        markField('reg-password', true); ok = false;
      }

      return ok;
    }

    // ── Redirect after success ────────────────────────────────────────
    function redirectToDashboard(delayMs) {
      setTimeout(function () {
        window.location.replace('dashboard.html');
      }, delayMs || 1500);
    }

    // ── LOGIN form submission ─────────────────────────────────────────
    function handleLogin(e) {
      e.preventDefault();
      if (!validateLoginForm()) return;

      var email    = $('login-email').value.trim();
      var password = $('login-password').value;
      var btn      = $('btn-login');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> <span>Memproses...</span>';

      setTimeout(function () {
        var result;
        try {
          if (typeof URAuth !== 'undefined' && URAuth.login) {
            result = URAuth.login({ email: email, password: password });
          } else if (typeof URStorage !== 'undefined' && URStorage.loginUser) {
            result = URStorage.loginUser({ email: email, password: password });
          } else {
            result = { success: false, error: 'Sistem autentikasi belum siap. Muat ulang halaman.' };
          }
        } catch (ex) {
          result = { success: false, error: 'Terjadi kesalahan: ' + ex.message };
        }

        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">login</span><span>Masuk</span>';

        if (result && result.success) {
          showToast('Berhasil masuk! Mengalihkan…', 'success');
          redirectToDashboard(1000);
        } else {
          var msg = (result && result.error) ? result.error : 'Email atau password salah.';
          setError('login-general-err', msg);
          markField('login-email', true);
          markField('login-password', true);
        }
      }, 300);
    }

    // ── REGISTER form submission ──────────────────────────────────────
    function handleRegister(e) {
      e.preventDefault();
      if (!validateRegisterForm()) return;

      var name     = $('reg-name').value.trim();
      var email    = $('reg-email').value.trim();
      var password = $('reg-password').value;
      var btn      = $('btn-register');

      if (typeof URStorage !== 'undefined' && URStorage.findUserByEmail) {
        var existing = URStorage.findUserByEmail(email);
        if (existing) {
          setError('reg-email-err', 'Email ini sudah terdaftar. Silakan masuk.');
          markField('reg-email', true);
          return;
        }
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> <span>Mendaftar...</span>';

      setTimeout(function () {
        var result;
        try {
          if (typeof URAuth !== 'undefined' && URAuth.register) {
            result = URAuth.register({ name: name, email: email, password: password });
          } else if (typeof URStorage !== 'undefined' && URStorage.registerUser) {
            result = URStorage.registerUser({ name: name, email: email, password: password });
          } else {
            result = { success: false, error: 'Sistem autentikasi belum siap. Muat ulang halaman.' };
          }
        } catch (ex) {
          result = { success: false, error: 'Terjadi kesalahan: ' + ex.message };
        }

        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">person_add</span><span>Buat Akun</span>';

        if (result && result.success) {
          showToast('Akun berhasil dibuat! Mengalihkan…', 'success');
          redirectToDashboard(1000);
        } else {
          var msg = (result && result.error) ? result.error : 'Gagal membuat akun.';
          if (msg.toLowerCase().includes('email') && msg.toLowerCase().includes('terdaftar')) {
            setError('reg-email-err', msg);
            markField('reg-email', true);
          } else {
            setError('reg-general-err', msg);
          }
        }
      }, 300);
    }

    // ── Theme icon sync ───────────────────────────────────────────────
    function syncThemeIcon() {
      var icon = $('theme-icon');
      if (!icon) return;
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark' || document.documentElement.classList.contains('dark');
      icon.textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    // ── Init ──────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      syncThemeIcon();

      function checkSession() {
        if (typeof URStorage !== 'undefined') {
          var session = URStorage.getSession ? URStorage.getSession() : null;
          if (session) { window.location.replace('dashboard.html'); return true; }
        }
        return false;
      }

      function tryInitAuthPage() {
        if (typeof URAuth !== 'undefined' && URAuth.initAuthPage) {
          URAuth.initAuthPage();
        }
      }

      if (typeof URStorage !== 'undefined') {
        if (!checkSession()) tryInitAuthPage();
      } else {
        var attempts = 0;
        var poll = setInterval(function () {
          if (typeof URStorage !== 'undefined' || ++attempts > 20) {
            clearInterval(poll);
            if (typeof URStorage !== 'undefined') {
              if (!checkSession()) tryInitAuthPage();
            }
          }
        }, 50);
      }

      if (window.location.hash === '#register') {
        switchTab('register');
      }

      var loginForm = $('form-login');
      if (loginForm) loginForm.addEventListener('submit', handleLogin);

      var regForm = $('form-register');
      if (regForm) regForm.addEventListener('submit', handleRegister);

      new MutationObserver(syncThemeIcon).observe(
        document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] }
      );
    });

  })();
  </script>

</body>
</html>
